<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Película</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-dark text-light">

  <header class="bg-secondary py-4 text-center">
    <h1 class="text-warning">🎬 Crea tu película</h1>
    <nav class="mt-3">
      <a href="index.html" class="btn btn-warning mx-2">Home</a>
      <a href="sobreproyecto.html" class="btn btn-warning mx-2">Sobre el proyecto</a>
      <a href="historiacine.html" class="btn btn-warning mx-2">Historia del cine</a>
    </nav>
  </header>

  <main class="container py-5">
    <div class="card bg-dark text-light shadow p-4">
      <h2 class="text-warning mb-4">📄 Formulario de Película</h2>
      <form id="movieForm">
        <div class="mb-3">
          <label for="title" class="form-label">Título</label>
          <input type="text" name="title" id="title" class="form-control" placeholder="Star Wars: Episodio IV" required>
        </div>

        <div class="mb-3">
          <label for="year" class="form-label">Año</label>
          <input type="number" name="year" id="year" class="form-control" placeholder="1977" required>
        </div>

        <div class="mb-3">
          <label for="director" class="form-label">Director</label>
          <input type="text" name="director" id="director" class="form-control" placeholder="George Lucas" required>
        </div>

        <div class="mb-3">
          <label for="duration" class="form-label">Duración</label>
          <input type="text" name="duration" id="duration" class="form-control" placeholder="2h 2min" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Géneros</label>
          <div id="genreCheckboxes" class="d-flex flex-wrap gap-3">
            <div class="form-check">
              <input type="checkbox" value="Acción" id="Accion" class="form-check-input">
              <label for="Accion" class="form-check-label">Acción</label>
            </div>
            <div class="form-check">
              <input type="checkbox" value="Terror" id="Terror" class="form-check-input">
              <label for="Terror" class="form-check-label">Terror</label>
            </div>
            <div class="form-check">
              <input type="checkbox" value="Aventura" id="Aventura" class="form-check-input">
              <label for="Aventura" class="form-check-label">Aventura</label>
            </div>
            <div class="form-check">
              <input type="checkbox" value="Drama" id="Drama" class="form-check-input">
              <label for="Drama" class="form-check-label">Drama</label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="rate" class="form-label">Puntaje</label>
          <input type="number" name="rate" id="rate" class="form-control" placeholder="8.7" required>
        </div>

        <div class="mb-4">
          <label for="poster" class="form-label">URL del Poster</label>
          <input type="url" name="poster" id="poster" class="form-control" placeholder="https://example.com/placeholder.png" required>
        </div>

        <button type="submit" class="btn btn-warning me-2">Enviar</button>
        <button type="button" id="resetBtn" class="btn btn-outline-light">Limpiar</button>
      </form>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/formHandler.js"></script>
</body>
</html>
